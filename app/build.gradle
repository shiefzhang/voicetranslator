plugins { id 'com.android.application' }
android {
    namespace 'com.vt.voicetranslator'
    compileSdk 35
    ndkVersion '27.0.12077973'
    defaultConfig {
        applicationId 'com.vt.voicetranslator'
        minSdk 26
        targetSdk 35
        versionCode 14
        versionName '0.2.12'
        testInstrumentationRunner 'com.vt.voicetranslator.SmokeInstrumentation'
        ndk { abiFilters (project.findProperty('vtAbi') ?: 'arm64-v8a') }
        externalNativeBuild { cmake { cppFlags '-std=c++17'; arguments '-DANDROID_STL=c++_shared' } }
    }
    applicationVariants.all { variant ->
            variant.outputs.all { output ->
                outputFileName = "voice_translator-${variant.name}-v${variant.versionName}.apk"
            }
    }
    externalNativeBuild { cmake { path 'src/main/cpp/CMakeLists.txt'; version '3.31.5' } }
    androidResources {
        // 内置模型包（scripts/model-tiers.py --emit 拷进 assets/bundled-models/）。
        // .vtmodel 内部是 STORED 的 zip，装载的又是已压缩过的 gguf / onnx，
        // 让 aapt2 再 deflate 一遍纯属浪费时间，所以直接按原样打进 APK。
        noCompress 'vtmodel'
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    buildTypes { release { minifyEnabled false } }
}
dependencies {
    implementation files('libs/sherpa-onnx-v1.13.6.aar')
    implementation files('libs/kotlin-stdlib-2.0.21.jar', 'libs/annotations-23.0.0.jar')
}
